name: Prompt Evals & Contract Gates
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  eval-prompts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install pytest jsonschema pyyaml
      - run: pytest -q tests/test_generadores_ia.py
      - run: npx --yes promptfoo@latest eval -c evals/promptfooconfig.yaml --no-cache
